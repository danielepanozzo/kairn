# The documentation site, built from docs/ (docs/developer/documentation.md). From the repository
# root, with docs/requirements.txt installed (in .venv/, for example):
#
#   mkdocs serve            # http://127.0.0.1:8000, rebuilt on every change
#   mkdocs build --strict   # writes site/; a broken link or anchor, or a page missing from nav, fails

site_name: Kairn
site_url: https://danielepanozzo.github.io/kairn/
site_description: Floating-point expansions with interval and ball arithmetic and machine-checked error bounds (in development)
repo_name: danielepanozzo/kairn
repo_url: https://github.com/danielepanozzo/kairn
edit_uri: edit/main/docs/
docs_dir: docs

# Doxygen's configuration and the main page of the C++ API reference, which Doxygen writes into
# api/ after the build, in place of the page api/index.md (docs/developer/documentation.md).
exclude_docs: |
  /requirements.txt
  /tools/
  /Doxyfile
  /api/mainpage.md

theme:
  name: material
  icon:
    logo: material/sigma
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  # Mathematics is written as $...$ and $$...$$ only, the two forms GitHub renders as well; MathJax
  # typesets what arithmatex marks (docs/assets/mathjax.js).
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: [dollar]
      block_syntax: [dollar]
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - What holds today: getting-started/guarantees.md
  - Tutorials:
      - Accurate sums and dot products: tutorials/accurate-sums.md
  # BEGIN reference: written by docs/tools/reference.py; do not edit by hand
  - Reference:
      - reference/index.md
      - How to read a page: reference/reading.md
      - C++ API: api/index.md
      - Construction and access:
          - A two-limb number from a value of T: reference/make_2.md
          - A two-limb number from its limbs: reference/make_2_limbs.md
          - A ball from a one-limb center and a radius: reference/ball_make_1.md
          - A ball from a two-limb center and a radius: reference/ball_make_2.md
          - Constants from fractions: reference/rational.md
      - Arithmetic:
          - Sum and difference, one limb: reference/add_1_1.md
          - Product, one limb: reference/mul_1_1.md
          - Sum of two two-limb numbers: reference/add_2_2_full.md
          - Sum of a two-limb number and a limb: reference/add_2_1_full.md
          - Difference of two two-limb numbers: reference/sub_2_2_full.md
          - A two-limb number minus a limb: reference/sub_2_1_full.md
          - A limb minus a two-limb number: reference/sub_1_2_full.md
          - Product of two two-limb numbers: reference/mul_2_2_full.md
          - Product of a two-limb number and a limb: reference/mul_2_1_full.md
          - Fast sum of two two-limb numbers: reference/add_fast_2_2_full.md
          - Negation, two limbs: reference/neg_2.md
          - Absolute value, two limbs: reference/abs_2.md
      - Arithmetic without the fix-up:
          - Sum of two two-limb numbers, finite core: reference/add_2_2.md
          - Sum of a two-limb number and a limb, finite core: reference/add_2_1.md
          - Difference of two two-limb numbers, finite core: reference/sub_2_2.md
          - A two-limb number minus a limb, finite core: reference/sub_2_1.md
          - A limb minus a two-limb number, finite core: reference/sub_1_2.md
          - Product of two two-limb numbers, finite core: reference/mul_2_2.md
          - Product of a two-limb number and a limb, finite core: reference/mul_2_1.md
          - Fast sum of two two-limb numbers, finite core: reference/add_fast_2_2.md
          - Scaling a two-limb number by a power of two, finite core: reference/mul_pow2_2.md
      - Comparisons:
          - Less than, two two-limb numbers: reference/lt_2_2.md
          - At most, two two-limb numbers: reference/le_2_2.md
          - Equality, two two-limb numbers: reference/eq_2_2.md
          - A two-limb number less than a limb: reference/lt_2_1.md
          - A two-limb number at most a limb: reference/le_2_1.md
          - A two-limb number equal to a limb: reference/eq_2_1.md
          - A limb less than a two-limb number: reference/lt_1_2.md
          - A limb at most a two-limb number: reference/le_1_2.md
      - Conversions to one limb:
          - Rounding to nearest: reference/to_nearest_2.md
          - Rounding down: reference/to_down_2.md
          - Rounding up: reference/to_up_2.md
          - Upper bound of the magnitude: reference/abs_upper_2.md
      - Scaling by a power of two:
          - Scaling a two-limb number by a power of two: reference/mul_pow2_2_full.md
      - Ball operations:
          - Sum of balls, one-limb center: reference/ball_add_1_full.md
          - Sum of balls, two-limb center: reference/ball_add_2_full.md
          - Difference of balls, one-limb center: reference/ball_sub_1_full.md
          - Difference of balls, two-limb center: reference/ball_sub_2_full.md
          - Product of balls, one-limb center: reference/ball_mul_1_full.md
          - Product of balls, two-limb center: reference/ball_mul_2_full.md
          - A ball times a limb, one-limb center: reference/ball_scale_1_full.md
          - A ball times a limb, two-limb center: reference/ball_scale_2_full.md
          - Negation of a ball, one-limb center: reference/ball_neg_1.md
          - Negation of a ball, two-limb center: reference/ball_neg_2.md
          - Sum of balls, one-limb center, finite core: reference/ball_add_1.md
          - Sum of balls, two-limb center, finite core: reference/ball_add_2.md
          - Difference of balls, one-limb center, finite core: reference/ball_sub_1.md
          - Difference of balls, two-limb center, finite core: reference/ball_sub_2.md
          - Product of balls, one-limb center, finite core: reference/ball_mul_1.md
          - Product of balls, two-limb center, finite core: reference/ball_mul_2.md
          - A ball times a limb, one-limb center, finite core: reference/ball_scale_1.md
          - A ball times a limb, two-limb center, finite core: reference/ball_scale_2.md
      - Building blocks:
          - "TwoSum: an exact sum as two limbs": reference/two_sum.md
          - "Fast2Sum: an exact sum of ordered operands": reference/fast_two_sum.md
          - "TwoProd: an exact product as two limbs": reference/two_prod.md
          - "Dekker's product: TwoProd without an FMA": reference/two_prod_dekker.md
          - Veltkamp's split: reference/split.md
          - An upper bound of a sum, for radii: reference/radd.md
          - An upper bound of a product, for radii: reference/rmul.md
  # END reference
  - Proofs: proofs/index.md
  - Developer guide:
      - Architecture: developer/architecture.md
      - Testing: developer/testing.md
      - Documentation: developer/documentation.md
      - Results:
          - Milestone 1 report: developer/results/milestone1.md
          - Brute force, Milestone 1: developer/results/brute-milestone1.md
          - Benchmarks, Milestone 1: developer/results/bench-milestone1.md
          - Compile times and other costs, Milestone 1: developer/results/costs-milestone1.md
          - Compile times and other costs, Milestone 2: developer/results/costs-milestone2.md
      - Design notes:
          - Phase 0 report:
              - developer/design/phase0/index.md
              - Numbers: developer/design/phase0/numbers.md
              - Operations: developer/design/phase0/operations.md
              - Environment: developer/design/phase0/environment.md
              - Verification: developer/design/phase0/verification.md
              - Library: developer/design/phase0/library.md
              - Plan: developer/design/phase0/plan.md
              - Decisions: developer/design/phase0/decisions.md
              - References: developer/design/phase0/references.md
          - Milestone 1 statements: developer/design/milestone1.md
          - Milestone 2 statements: developer/design/milestone2.md
          - The original brief: developer/design/brief.md

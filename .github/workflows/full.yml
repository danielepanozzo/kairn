# The full tier: every test that left the quick tier (docs/developer/testing.md), on every push and
# pull request, in jobs that run beside those of build.yml. ctest --test-dir build/tests/full
# registers it; a label says what each test depends on, and each runs where that changes:
#
# - the compiled runners' cross-checks and the public interface against the oracle on more cases
#   (labelled neither python nor generator) depend on the compiler: one job per platform and
#   compiler, as in build.yml, with the same configuration and build; with them, the tools' own
#   tests that were in the quick tier (label tools: the oracle's, which compiles its own runner
#   with the build's compiler, those of the cross-checks' guards, of the script of the reference
#   pages and of the brute-force driver), so that they run where build.yml ran them;
# - the interpreter's enumerations of toy formats and the oracle's own enumerations (label
#   python) compute in exact arithmetic, in Python alone: once, on Linux, in four jobs that only
#   configure (they run no compiled program);
# - the generator's tests without C++ (label generator) compare the interpreter with the machine's
#   arithmetic: they run inside the generator's whole suite in generator.yml, on every operating
#   system, and not here.
#
# The full tier's tests of kairn/upward.hpp, the round-up interval (label upward: the flag matrix of
# its runners and of its public type's tests, the object code on its whole matrix, its emulated
# kernels, the interpreter on its toy formats), run in these jobs on Linux and macOS. The Windows jobs configure
# -DKAIRN_UPWARD_TESTS=OFF: the jobs "Windows x64, upward" of build.yml run the family's tests that
# depend on the compiler with MSVC and clang-cl, and the python jobs below its enumerations.
#
# The full tier's tests of the experimental headers (label experimental, full.experimental.*: the
# exact checks of the two-limb and four-limb intervals rounded upward, EXPERIMENTAL and NOT
# VERIFIED, in every variant at -O2 and -O3) depend on the compiler: they run in the compiled jobs
# on Linux and macOS. With MSVC and clang-cl they are not registered, so no Windows job runs them.
name: Full tier

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a new push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compiled:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The Windows runners are the slow ones (a cross-check of a compiled runner takes 18 s there
    # and 7 s on Linux; the oracle's self-test 17 minutes and 9): with the kernels of Milestone 2
    # the tier's tests add up to about four hours of one core there, which four cores do not finish
    # in an hour (both Windows jobs were cancelled at 60 minutes with 534 and 536 of 939 tests
    # done). So each Windows compiler runs the tier in three shards, each its own job with its own
    # build: ctest runs the tests that pass the label filter AND whose number is in the stride
    # (-I start,,3), so the three shards are the job's tests, each once. The stride is quoted: the
    # step runs in PowerShell on Windows, where a bare 1,,3 is a syntax error. With the functions on
    # arrays, the ball vectors and the exhaustive tier (2 000 tests) the others grew too: on
    # 2026-11-22 Linux x86-64 took 40 minutes with Clang and was cancelled at 60 with GCC, and macOS
    # took 55. Those three run in two shards each; Linux arm64, 29 to 31 minutes, in one job.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64, GCC, 1 of 2
            os: ubuntu-24.04
            cxx: g++
            shard: '-I "1,,2"'
          - name: Linux x86-64, GCC, 2 of 2
            os: ubuntu-24.04
            cxx: g++
            shard: '-I "2,,2"'
          - name: Linux x86-64, Clang, 1 of 2
            os: ubuntu-24.04
            cxx: clang++
            shard: '-I "1,,2"'
          - name: Linux x86-64, Clang, 2 of 2
            os: ubuntu-24.04
            cxx: clang++
            shard: '-I "2,,2"'
          - name: Linux arm64, GCC
            os: ubuntu-24.04-arm
            cxx: g++
          - name: Linux arm64, Clang
            os: ubuntu-24.04-arm
            cxx: clang++
          - name: macOS arm64, Apple clang, 1 of 2
            os: macos-15
            cxx: clang++
            shard: '-I "1,,2"'
          - name: macOS arm64, Apple clang, 2 of 2
            os: macos-15
            cxx: clang++
            shard: '-I "2,,2"'
          - name: Windows x64, MSVC, 1 of 3
            os: windows-2025
            cxx: cl
            shard: '-I "1,,3"'
            options: -DKAIRN_UPWARD_TESTS=OFF
          - name: Windows x64, MSVC, 2 of 3
            os: windows-2025
            cxx: cl
            shard: '-I "2,,3"'
            options: -DKAIRN_UPWARD_TESTS=OFF
          - name: Windows x64, MSVC, 3 of 3
            os: windows-2025
            cxx: cl
            shard: '-I "3,,3"'
            options: -DKAIRN_UPWARD_TESTS=OFF
          - name: Windows x64, clang-cl, 1 of 3
            os: windows-2025
            cxx: clang-cl
            shard: '-I "1,,3"'
            options: -DKAIRN_UPWARD_TESTS=OFF
          - name: Windows x64, clang-cl, 2 of 3
            os: windows-2025
            cxx: clang-cl
            shard: '-I "2,,3"'
            options: -DKAIRN_UPWARD_TESTS=OFF
          - name: Windows x64, clang-cl, 3 of 3
            os: windows-2025
            cxx: clang-cl
            shard: '-I "3,,3"'
            options: -DKAIRN_UPWARD_TESTS=OFF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in build.yml; 3.13 or later also so that the oracle's selftest checks its rounding
      # against the machine (rounding_hardware needs math.fma).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # As in build.yml: the variables of a Visual Studio developer prompt for the steps that
      # follow, the oracle's selftest among them, which runs the compiler itself.
      - name: Visual Studio developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the x64 C++ tools" }
          $bat = Join-Path $env:RUNNER_TEMP "vcvars-and-set.bat"
          Set-Content -Path $bat -Value "@call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul || exit /b 1", "@set"
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $lines = & cmd.exe /d /c $bat
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -cne $Matches[2]) {
              Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])"
            }
          }

      # As in build.yml: the image's clang-cl with the image's newer standard library.
      - name: Let the image's clang-cl use the image's newer standard library
        if: matrix.cxx == 'clang-cl'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "CL=/D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          ${{ matrix.options }}

      - name: Build
        run: cmake --build build --parallel

      - name: Full tier, the tests that depend on the compiler, and the tools' own tests
        run: ctest --test-dir build/tests/full --output-on-failure --parallel 4 -LE "python|generator" ${{ matrix.shard }}

  # Four shards, so that no job takes much more than a quarter of an hour on a hosted runner: the
  # interpreter's enumerations in three (340 tests since the kernels of Milestone 2: as one job
  # they were cancelled at its limit of 30 minutes, 258 tests done), and the oracle's own (a
  # single test with four workers). ctest runs the tests that have the label AND whose number is
  # in the stride (-I start,,3), so the three shards are the tests labelled interp, each once.
  python:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, Python only, the interpreter's enumerations, 1 of 3
            labels: -L interp -I 1,,3
          - name: Linux, Python only, the interpreter's enumerations, 2 of 3
            labels: -L interp -I 2,,3
          - name: Linux, Python only, the interpreter's enumerations, 3 of 3
            labels: -L interp -I 3,,3
          - name: Linux, Python only, the oracle's enumerations
            labels: -L python -LE interp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Configuring registers the tests; these run no compiled program, so nothing is built.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # Every test labelled interp is labelled python too: the four shards are the tests labelled
      # python, each once.
      - name: Full tier, the tests in exact arithmetic
        run: ctest --test-dir build/tests/full --output-on-failure --parallel 4 ${{ matrix.labels }}

# The generated files are what the generator writes, the reference pages are what
# docs/tools/reference.py writes, the documentation site builds without a warning and with every
# link resolving, and Doxygen writes the C++ API reference into its api/ without a warning
# (docs/developer/documentation.md); the built site is kept as an artifact of the run, named site.
# One job: each step takes seconds.
name: Generated files and documentation

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a new push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Generated files and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generated files are fresh
        run: python3 gen/kairn-gen check

      - name: Reference pages are fresh
        run: python3 docs/tools/reference.py --check

      - name: Tests of the reference generator
        run: python3 docs/tools/test_reference.py

      - name: Install MkDocs
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r docs/requirements.txt

      - name: Build the site, warnings as errors
        run: .venv/bin/mkdocs build --strict

      # docs/Doxyfile is checked with Doxygen 1.18.0, so the job installs that release, by its
      # SHA-256 as GitHub lists it, rather than Ubuntu's package (1.9.8 on ubuntu-24.04).
      - name: Install Doxygen 1.18.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/doxygen.tar.gz" \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  $RUNNER_TEMP/doxygen.tar.gz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"

      # Into site/api/, over the page that MkDocs made there from docs/api/index.md.
      - name: Build the C++ API reference, warnings as errors
        run: |
          doxygen --version
          doxygen docs/Doxyfile

      # MkDocs writes the site into site/ (mkdocs.yml leaves site_dir at its default), and Doxygen
      # its api/.
      - name: Keep the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/
          if-no-files-found: error

      - name: Check links and anchors as GitHub resolves them
        run: python3 docs/tools/check_links.py

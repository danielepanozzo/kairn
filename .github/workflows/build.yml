# Build and quick tier: configure, build and ctest on every hosted platform and compiler
# (docs/developer/testing.md). The same three commands as in docs/getting-started/index.md, with
# Ninja everywhere, Release, warnings as errors, and the compiler named. The packed kernels are
# tested with the backend of each runner: AVX2 on the x86-64 ones (whose CPUs have it), NEON on
# the arm64 ones (Linux and macOS). ctest in the build directory runs the quick tier only, the
# tests of the library with each compiler; the full tier, everything that left it (the tools' own
# tests among them), runs beside these jobs in full.yml, and the generator's whole suite, its C++
# tests included, in generator.yml.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a new push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64, GCC
            os: ubuntu-24.04
            cxx: g++
          - name: Linux x86-64, Clang
            os: ubuntu-24.04
            cxx: clang++
          - name: Linux arm64, GCC
            os: ubuntu-24.04-arm
            cxx: g++
          - name: Linux arm64, Clang
            os: ubuntu-24.04-arm
            cxx: clang++
          - name: macOS arm64, Apple clang
            os: macos-15
            cxx: clang++
          - name: Windows x64, MSVC
            os: windows-2025
            cxx: cl
          - name: Windows x64, clang-cl
            os: windows-2025
            cxx: clang-cl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Python for the oracle, which judges the quick tier's runs, and the other Python tools it
      # runs; the version of the other workflows. The action sets Python3_ROOT_DIR, which CMake's
      # FindPython3 follows.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # cl, clang-cl and the tests that run the compiler themselves (the object code, what must not
      # compile, api.k1.zero_cost) need the variables of a Visual Studio developer prompt: those
      # that vcvars64.bat sets or changes go into GITHUB_ENV for the steps that follow.
      - name: Visual Studio developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the x64 C++ tools" }
          $bat = Join-Path $env:RUNNER_TEMP "vcvars-and-set.bat"
          Set-Content -Path $bat -Value "@call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul || exit /b 1", "@set"
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $lines = & cmd.exe /d /c $bat
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -cne $Matches[2]) {
              Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])"
            }
          }

      # The standard library of the hosted image (MSVC 14.52) refuses a Clang older than 22 with
      # its error STL1000, and the clang-cl of the same image is 20.1. The library's own switch
      # accepts the pair. clang-cl reads the options of the variable CL on every compilation: the
      # checks of the configuration, the oracle's runner and the consumer projects included.
      - name: Let the image's clang-cl use the image's newer standard library
        if: matrix.cxx == 'clang-cl'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "CL=/D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

# The generator's whole suite, its C++ tests included: python3 gen/kairn-gen test with each
# GCC-style compiler of the hosted runners (docs/developer/testing.md). The full tier (ctest in
# build/tests/full) registers the suite without its C++ tests, which compile the generated code at
# -O0 and -O2, with and without -frounding-math, under every contraction setting, and require
# every build, scalar and packed, to be bit-identical to the interpreter, in two tests labelled
# generator, which full.yml leaves to this workflow: its four longest test classes, which compare
# the interpreter with the machine's own arithmetic and judge the statements on thousands of cases
# (full.kairn-gen.test), and the rest (full.tools.kairn-gen.test). Here all of it runs, one job
# per compiler, and on Windows, which has no GCC-style compiler here, everything but the C++ tests,
# so that the tests without C++, which compare with the machine's arithmetic, run on every
# operating system.
name: Generator's full suite

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a new push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The suite grows with every kernel (it compiles each in every configuration): with the
    # kernels of the intervals and of the loops over arrays the macOS job, which also builds and
    # runs the x86-64 forms under Rosetta, was cancelled at 30 minutes, and Clang on Linux took 29.
    # With all the kernels of Milestone 2 the macOS job took 58 minutes and was cancelled at 60
    # in the next run, with 35 to 44 on the other runners: it is two jobs, each every second test
    # (kairn-gen test --shard K/2: the two are the suite, each test once).
    # On 2026-11-22, with the entry forms of rule R3, the job of GCC on Linux x86-64 took 33 to 59
    # minutes from one run to the next and was cancelled at 60 in a third: the four Linux jobs
    # are two jobs each too.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64, GCC (scalar and AVX2), 1 of 2
            os: ubuntu-24.04
            tests: --cxx g++ --shard 1/2
          - name: Linux x86-64, GCC (scalar and AVX2), 2 of 2
            os: ubuntu-24.04
            tests: --cxx g++ --shard 2/2
          - name: Linux x86-64, Clang (scalar and AVX2), 1 of 2
            os: ubuntu-24.04
            tests: --cxx clang++ --shard 1/2
          - name: Linux x86-64, Clang (scalar and AVX2), 2 of 2
            os: ubuntu-24.04
            tests: --cxx clang++ --shard 2/2
          - name: Linux arm64, GCC (scalar and NEON), 1 of 2
            os: ubuntu-24.04-arm
            tests: --cxx g++ --shard 1/2
          - name: Linux arm64, GCC (scalar and NEON), 2 of 2
            os: ubuntu-24.04-arm
            tests: --cxx g++ --shard 2/2
          - name: Linux arm64, Clang (scalar and NEON), 1 of 2
            os: ubuntu-24.04-arm
            tests: --cxx clang++ --shard 1/2
          - name: Linux arm64, Clang (scalar and NEON), 2 of 2
            os: ubuntu-24.04-arm
            tests: --cxx clang++ --shard 2/2
          - name: macOS arm64, Apple clang (scalar and NEON), 1 of 2
            os: macos-15
            tests: --cxx c++ --shard 1/2
          - name: macOS arm64, Apple clang (scalar and NEON), 2 of 2
            os: macos-15
            tests: --cxx c++ --shard 2/2
          - name: Windows x64 (no C++ tests)
            os: windows-2025
            tests: --no-cxx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Python 3.13 or later: the interpreter's tests compare it with math.fma.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # python: the 3.14 of setup-python, under the one name it has on every runner. --durations:
      # the 25 slowest tests of the job are printed after its summary, so that the limits and the
      # shards can be sized from the times of the hosted runners themselves.
      - name: The generator's tests
        run: python gen/kairn-gen test ${{ matrix.tests }} --durations 25
